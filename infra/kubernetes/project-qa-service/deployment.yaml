apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-qa-service
  namespace: cascade-system
  labels:
    app: project-qa-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-qa-service
  template:
    metadata:
      labels:
        app: project-qa-service
    spec:
      containers:
        - name: project-qa-service
          image: cascade-project-qa-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8040
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
