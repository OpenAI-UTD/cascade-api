apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator-service
  namespace: cascade-system
  labels:
    app: agent-orchestrator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator-service
  template:
    metadata:
      labels:
        app: agent-orchestrator-service
    spec:
      containers:
        - name: agent-orchestrator-service
          image: cascade-agent-orchestrator-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8018
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: AGENT_TOOL_GATEWAY_URL
              value: http://agent-tool-gateway.cascade-system.svc.cluster.local:8017
            - name: AGENT_RUNTIME_MODE
              value: deterministic
            - name: LLM_PROVIDER
              value: none
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: AGENT_EVENTS_TOPIC
              value: agent.investigations
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
