apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-planner-service
  namespace: cascade-system
  labels:
    app: chaos-planner-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-planner-service
  template:
    metadata:
      labels:
        app: chaos-planner-service
    spec:
      containers:
        - name: chaos-planner-service
          image: cascade-chaos-planner-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8019
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: TOPOLOGY_SERVICE_URL
              value: http://topology-service.cascade-system.svc.cluster.local:8004
            - name: RETRIEVAL_SERVICE_URL
              value: http://retrieval-service.cascade-system.svc.cluster.local:8012
            - name: CASCADE_AUTH_ENABLED
              value: "false"
            - name: CASCADE_LOCAL_DEMO_AUTH_BYPASS
              value: "false"
            - name: CASCADE_API_KEYS
              value: ""
            - name: CASCADE_API_KEY_HASHES
              value: ""
            - name: CASCADE_AUTH_HEADER
              value: Authorization
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
