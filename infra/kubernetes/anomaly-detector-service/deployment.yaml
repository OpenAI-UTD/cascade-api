apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector-service
  namespace: cascade-system
  labels:
    app: anomaly-detector-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detector-service
  template:
    metadata:
      labels:
        app: anomaly-detector-service
    spec:
      containers:
        - name: anomaly-detector-service
          image: cascade-anomaly-detector-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8014
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: ANOMALIES_TOPIC
              value: anomalies.detected
            - name: ANOMALY_BACKGROUND_ENABLED
              value: "false"
            - name: ZSCORE_THRESHOLD
              value: "3.0"
            - name: ISOLATION_FOREST_MIN_WINDOWS
              value: "20"
            - name: ANOMALY_PUBLISH_THRESHOLD
              value: "0.4"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
