apiVersion: apps/v1
kind: Deployment
metadata:
  name: evals-service
  namespace: cascade-system
  labels:
    app: evals-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evals-service
  template:
    metadata:
      labels:
        app: evals-service
    spec:
      containers:
        - name: evals-service
          image: cascade-evals-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8041
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
