apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: cascade-system
  labels:
    app: retrieval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-service
  template:
    metadata:
      labels:
        app: retrieval-service
    spec:
      containers:
        - name: retrieval-service
          image: cascade-retrieval-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8012
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: QDRANT_URL
              value: http://qdrant.cascade-system.svc.cluster.local:6333
            - name: QDRANT_COLLECTION
              value: cascade_incident_memory
            - name: QDRANT_KNOWLEDGE_COLLECTION
              value: cascade_knowledge_base
            - name: EMBEDDING_DIMENSIONS
              value: "128"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 600m
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
