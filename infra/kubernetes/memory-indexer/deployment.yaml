apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-indexer
  namespace: cascade-system
  labels:
    app: memory-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-indexer
  template:
    metadata:
      labels:
        app: memory-indexer
    spec:
      containers:
        - name: memory-indexer
          image: cascade-memory-indexer:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8011
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: TELEMETRY_ENRICHED_TOPIC
              value: telemetry.enriched
            - name: EXPERIMENTS_EVENTS_TOPIC
              value: experiments.events
            - name: QDRANT_URL
              value: http://qdrant.cascade-system.svc.cluster.local:6333
            - name: QDRANT_COLLECTION
              value: cascade_incident_memory
            - name: EMBEDDING_DIMENSIONS
              value: "128"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
