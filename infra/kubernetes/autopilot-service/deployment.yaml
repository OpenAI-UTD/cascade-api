apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-service
  namespace: cascade-system
  labels:
    app: autopilot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autopilot-service
  template:
    metadata:
      labels:
        app: autopilot-service
    spec:
      containers:
        - name: autopilot-service
          image: cascade-autopilot-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8024
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: RETRIEVAL_SERVICE_URL
              value: http://retrieval-service.cascade-system.svc.cluster.local:8012
            - name: ANOMALY_DETECTOR_SERVICE_URL
              value: http://anomaly-detector-service.cascade-system.svc.cluster.local:8014
            - name: AGENT_ORCHESTRATOR_SERVICE_URL
              value: http://agent-orchestrator-service.cascade-system.svc.cluster.local:8018
            - name: REMEDIATION_RECOMMENDER_SERVICE_URL
              value: http://remediation-recommender-service.cascade-system.svc.cluster.local:8021
            - name: APPROVAL_SERVICE_URL
              value: http://approval-service.cascade-system.svc.cluster.local:8022
            - name: REMEDIATION_EXECUTOR_SERVICE_URL
              value: http://remediation-executor-service.cascade-system.svc.cluster.local:8023
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: AUTOPILOT_EVENTS_TOPIC
              value: autopilot.runs
            - name: DEFAULT_MODE
              value: dry_run
            - name: CASCADE_AUTH_ENABLED
              value: "false"
            - name: CASCADE_LOCAL_DEMO_AUTH_BYPASS
              value: "false"
            - name: CASCADE_API_KEYS
              value: ""
            - name: CASCADE_API_KEY_HASHES
              value: ""
            - name: CASCADE_AUTH_HEADER
              value: Authorization
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
