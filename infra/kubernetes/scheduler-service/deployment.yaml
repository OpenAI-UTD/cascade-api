apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: cascade-system
  labels:
    app: scheduler-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-service
  template:
    metadata:
      labels:
        app: scheduler-service
    spec:
      containers:
        - name: scheduler-service
          image: cascade-scheduler-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8025
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: CHAOS_PLANNER_SERVICE_URL
              value: http://chaos-planner-service.cascade-system.svc.cluster.local:8019
            - name: AUTOPILOT_SERVICE_URL
              value: http://autopilot-service.cascade-system.svc.cluster.local:8024
            - name: SCHEDULER_POLL_INTERVAL_SECONDS
              value: "30"
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: CASCADE_AUTH_ENABLED
              value: "false"
            - name: CASCADE_LOCAL_DEMO_AUTH_BYPASS
              value: "false"
            - name: CASCADE_API_KEYS
              value: ""
            - name: CASCADE_API_KEY_HASHES
              value: ""
            - name: CASCADE_AUTH_HEADER
              value: Authorization
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
