---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: cascade-system
  labels:
    app: redpanda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
          command:
            - rpk
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --overprovisioned
            - --default-log-level=warn
            - --smp
            - "1"
            - --memory
            - 768M
            - --reserve-memory
            - 0M
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda.cascade-system.svc.cluster.local:9092
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          startupProbe:
            tcpSocket:
              port: kafka
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 10
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: cascade-system
  labels:
    app: redpanda
    cascade.io/state: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: cascade-system
  labels:
    app: redpanda
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics-init
  namespace: cascade-system
  labels:
    app: redpanda-topics-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: redpanda-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics-init
          image: redpandadata/redpanda:v24.3.5
          imagePullPolicy: IfNotPresent
          env:
            - name: REDPANDA_BROKERS
              value: redpanda.cascade-system.svc.cluster.local:9092
          command:
            - /bin/bash
            - -ec
            - |
              until rpk -X brokers="${REDPANDA_BROKERS}" cluster info >/dev/null 2>&1; do
                echo "Waiting for Redpanda Kafka API at ${REDPANDA_BROKERS}..."
                sleep 5
              done

              configure_topic() {
                topic="$1"
                retention_ms="$2"
                retention_bytes="$3"
                rpk -X brokers="${REDPANDA_BROKERS}" topic create "${topic}" -c cleanup.policy=delete -c retention.ms="${retention_ms}" -c retention.bytes="${retention_bytes}" || true
                rpk -X brokers="${REDPANDA_BROKERS}" topic alter-config "${topic}" --set cleanup.policy=delete --set retention.ms="${retention_ms}" --set retention.bytes="${retention_bytes}" || true
                rpk -X brokers="${REDPANDA_BROKERS}" topic describe "${topic}" >/dev/null
              }

              configure_topic telemetry.raw 604800000 536870912
              configure_topic telemetry.enriched 1209600000 1073741824
              configure_topic experiments.events 7776000000 268435456
              configure_topic anomalies.detected 7776000000 268435456
              configure_topic agent.investigations 15552000000 268435456
              configure_topic chaos.experiments 15552000000 268435456
              configure_topic remediation.actions 15552000000 268435456
              configure_topic causality.reports 15552000000 268435456
              configure_topic autopilot.runs 15552000000 268435456

              for topic in telemetry.raw telemetry.enriched experiments.events anomalies.detected agent.investigations chaos.experiments remediation.actions causality.reports autopilot.runs; do
                rpk -X brokers="${REDPANDA_BROKERS}" topic describe "${topic}" >/dev/null
              done

              rpk -X brokers="${REDPANDA_BROKERS}" topic list
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: cascade-system
  labels:
    app: clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: cascade
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ""
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: cascade-system
  labels:
    app: clickhouse
    cascade.io/state: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: cascade-system
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema-init
  namespace: cascade-system
  labels:
    app: clickhouse-schema-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: clickhouse-schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: clickhouse/clickhouse-server:24.8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              until clickhouse-client --host clickhouse --query "SELECT 1"; do sleep 3; done
              clickhouse-client --host clickhouse --multiquery <<'SQL'
              CREATE DATABASE IF NOT EXISTS cascade;
              CREATE TABLE IF NOT EXISTS cascade.audit_events (
                  event_id String,
                  timestamp DateTime64(3),
                  event_type String,
                  subsystem String,
                  severity String,
                  run_id String,
                  correlation_id String,
                  service String,
                  namespace String,
                  actor String,
                  action String,
                  decision String,
                  status String,
                  risk_level String,
                  policy_decision_id String,
                  remediation_execution_id String,
                  verification_id String,
                  rollback_plan_id String,
                  autopilot_run_id String,
                  chaos_experiment_id String,
                  campaign_id String,
                  rca_report_id String,
                  topology_node_or_edge_id String,
                  evidence_summary String,
                  raw_payload_json String,
                  user_safe_message String
              ) ENGINE = ReplacingMergeTree(timestamp) ORDER BY (timestamp, subsystem, service, event_id);
              CREATE TABLE IF NOT EXISTS cascade.telemetry_events (
                  event_id String,
                  observed_at DateTime64(3),
                  ingested_at DateTime64(3),
                  source_topic String,
                  event_type String,
                  namespace String,
                  service String,
                  workload String,
                  pod String,
                  severity String,
                  health_status String,
                  experiment_id String,
                  trace_id String,
                  raw_json String,
                  enriched_json String,
                  labels_json String,
                  numeric_features_json String
              ) ENGINE = MergeTree ORDER BY (service, observed_at, event_id);
              CREATE TABLE IF NOT EXISTS cascade.experiment_events (
                  event_id String,
                  experiment_id String,
                  experiment_type String,
                  target_namespace String,
                  target_service String,
                  target_workload String,
                  status String,
                  started_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  observed_at DateTime64(3),
                  ingested_at DateTime64(3),
                  source_topic String,
                  event_json String
              ) ENGINE = MergeTree ORDER BY (experiment_id, observed_at, event_id);
              CREATE TABLE IF NOT EXISTS cascade.incidents (
                  incident_id String,
                  experiment_id String,
                  root_cause_service String,
                  root_cause_summary String,
                  severity String,
                  status String,
                  confidence Float64,
                  first_seen_at DateTime64(3),
                  last_seen_at DateTime64(3),
                  created_at DateTime64(3),
                  affected_services_json String,
                  causal_chain_json String,
                  evidence_json String,
                  incident_json String
              ) ENGINE = MergeTree ORDER BY (root_cause_service, first_seen_at, incident_id);
              CREATE TABLE IF NOT EXISTS cascade.incident_reports (
                  report_id String,
                  incident_id String,
                  experiment_id String,
                  generated_at DateTime64(3),
                  root_cause_service String,
                  severity String,
                  markdown_report String,
                  report_json String
              ) ENGINE = MergeTree ORDER BY (root_cause_service, generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.topology_snapshots (
                  snapshot_id String,
                  captured_at DateTime64(3),
                  topology_json String,
                  service_count UInt64,
                  edge_count UInt64
              ) ENGINE = MergeTree ORDER BY (captured_at, snapshot_id);
              CREATE TABLE IF NOT EXISTS cascade.telemetry_feature_windows (
                  window_id String,
                  service String,
                  namespace String,
                  workload String,
                  window_start DateTime64(3),
                  window_end DateTime64(3),
                  extracted_at DateTime64(3),
                  event_count UInt64,
                  unhealthy_count UInt64,
                  healthy_count UInt64,
                  restart_signal_count UInt64,
                  warning_count UInt64,
                  error_count UInt64,
                  experiment_event_count UInt64,
                  incident_context_count UInt64,
                  avg_cpu Float64,
                  max_cpu Float64,
                  avg_memory Float64,
                  max_memory Float64,
                  avg_latency_ms Float64,
                  max_latency_ms Float64,
                  latency_p50_ms Float64,
                  latency_p95_ms Float64,
                  latency_p99_ms Float64,
                  request_rate Float64,
                  error_rate Float64,
                  restart_rate Float64,
                  unhealthy_rate Float64,
                  readiness_rate Float64,
                  availability_rate Float64,
                  warning_event_count Float64,
                  missing_metric_count UInt64,
                  dependency_unhealthy_count UInt64,
                  feature_vector_json String,
                  source_query_hash String
              ) ENGINE = MergeTree ORDER BY (service, window_start, window_id);
              CREATE TABLE IF NOT EXISTS cascade.anomaly_events (
                  anomaly_id String,
                  detected_at DateTime64(3),
                  window_id String,
                  service String,
                  namespace String,
                  workload String,
                  window_start DateTime64(3),
                  window_end DateTime64(3),
                  severity String,
                  status String,
                  anomaly_score Float64,
                  risk_score Float64,
                  model_name String,
                  model_version String,
                  detector_type String,
                  is_anomaly UInt8,
                  explanation String,
                  evidence_json String,
                  feature_vector_json String,
                  related_experiment_id String,
                  published_to_redpanda UInt8
              ) ENGINE = ReplacingMergeTree(detected_at) ORDER BY (anomaly_id);
              CREATE TABLE IF NOT EXISTS cascade.causal_reports (
                  report_id String,
                  generated_at DateTime64(3),
                  target_service String,
                  target_feature String,
                  source_feature String,
                  status String,
                  summary String,
                  window_start Nullable(DateTime64(3)),
                  window_end Nullable(DateTime64(3)),
                  candidate_count UInt64,
                  methodology_json String,
                  limitations_json String,
                  report_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.causal_candidates (
                  report_id String,
                  candidate_id String,
                  generated_at DateTime64(3),
                  rank UInt64,
                  source_service String,
                  target_service String,
                  source_feature String,
                  target_feature String,
                  status String,
                  rank_score Float64,
                  best_p_value Nullable(Float64),
                  effect_size Float64,
                  lag_windows UInt64,
                  sample_count UInt64,
                  pearson_json String,
                  spearman_json String,
                  granger_json String,
                  topology_distance Nullable(Int64),
                  anomaly_context_json String,
                  limitations_json String,
                  candidate_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (report_id, rank, candidate_id);
              CREATE TABLE IF NOT EXISTS cascade.rca_reports (
                  report_id String,
                  generated_at DateTime64(3),
                  target_service String,
                  likely_root_cause_service String,
                  status String,
                  confidence_score Float64,
                  affected_services_json String,
                  related_chaos_json String,
                  evidence_json String,
                  timeline_json String,
                  limitations_json String,
                  explanation String,
                  report_json String
              ) ENGINE = ReplacingMergeTree(generated_at)
              ORDER BY (generated_at, report_id);
              CREATE TABLE IF NOT EXISTS cascade.model_runs (
                  run_id String,
                  started_at DateTime64(3),
                  completed_at DateTime64(3),
                  model_name String,
                  model_version String,
                  detector_type String,
                  windows_scored UInt64,
                  anomalies_detected UInt64,
                  status String,
                  config_json String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_documents (
                  document_id String,
                  source_type String,
                  document_type String,
                  title String,
                  source_path String,
                  source_uri String,
                  content_hash String,
                  ingested_at DateTime64(3),
                  updated_at DateTime64(3),
                  phase String,
                  service String,
                  namespace String,
                  severity String,
                  tags_json String,
                  metadata_json String,
                  raw_content String
              ) ENGINE = ReplacingMergeTree(updated_at)
              ORDER BY (source_type, document_type, document_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_chunks (
                  chunk_id String,
                  document_id String,
                  chunk_index UInt64,
                  source_type String,
                  document_type String,
                  title String,
                  source_path String,
                  content_hash String,
                  chunk_hash String,
                  ingested_at DateTime64(3),
                  phase String,
                  service String,
                  namespace String,
                  severity String,
                  tags_json String,
                  metadata_json String,
                  chunk_text String,
                  embedding_model String,
                  qdrant_collection String,
                  qdrant_point_id String
              ) ENGINE = ReplacingMergeTree(ingested_at)
              ORDER BY (source_type, document_type, document_id, chunk_index, chunk_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_ingestion_runs (
                  run_id String,
                  started_at DateTime64(3),
                  completed_at DateTime64(3),
                  source String,
                  source_type String,
                  documents_seen UInt64,
                  documents_ingested UInt64,
                  chunks_created UInt64,
                  chunks_indexed UInt64,
                  status String,
                  config_json String,
                  error_message String
              ) ENGINE = MergeTree ORDER BY (started_at, run_id);
              CREATE TABLE IF NOT EXISTS cascade.knowledge_queries (
                  query_id String,
                  queried_at DateTime64(3),
                  query_text String,
                  filters_json String,
                  result_count UInt64,
                  top_score Float64,
                  latency_ms Float64,
                  response_json String
              ) ENGINE = MergeTree ORDER BY (queried_at, query_id);
              CREATE TABLE IF NOT EXISTS cascade.investigation_runs (
                  investigation_id String,
                  created_at DateTime64(3),
                  updated_at DateTime64(3),
                  completed_at Nullable(DateTime64(3)),
                  status String,
                  mode String,
                  trigger_type String,
                  trigger_id String,
                  service String,
                  namespace String,
                  severity String,
                  risk_score Float64,
                  title String,
                  objective String,
                  final_summary String,
                  confidence Float64,
                  tools_used_json String,
                  evidence_refs_json String,
                  config_json String,
                  error_message String
              ) ENGINE = ReplacingMergeTree(updated_at)
              ORDER BY (created_at, investigation_id);
              CREATE TABLE IF NOT EXISTS cascade.agent_steps (
                  step_id String,
                  investigation_id String,
                  created_at DateTime64(3),
                  node_name String,
                  agent_role String,
