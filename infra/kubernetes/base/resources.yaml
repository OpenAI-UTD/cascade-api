apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: cascade-system
  labels:
    app: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
          env:
            - name: QDRANT__SERVICE__MAX_WORKERS
              value: "2"
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: "2"
            - name: QDRANT__STORAGE__OPTIMIZERS__MAX_OPTIMIZATION_THREADS
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: cascade-system
  labels:
    app: qdrant
    cascade.io/state: durable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cascade-system
  labels:
    app: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-collection-init
  namespace: cascade-system
  labels:
    app: qdrant-collection-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: qdrant-collection-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              until curl -sf http://qdrant:6333/readyz; do sleep 3; done
              code="$(curl -s -o /tmp/qdrant-init-response -w '%{http_code}' -X PUT http://qdrant:6333/collections/cascade_incident_memory \
                -H 'Content-Type: application/json' \
                --data '{"vectors":{"size":128,"distance":"Cosine"},"optimizers_config":{"indexing_threshold":1000}}')"
              if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then
                cat /tmp/qdrant-init-response
              else
                cat /tmp/qdrant-init-response
                exit 1
              fi
              curl -sf -X PATCH http://qdrant:6333/collections/cascade_incident_memory \
                -H 'Content-Type: application/json' \
                --data '{"optimizers_config":{"indexing_threshold":1000}}'
              curl -sf http://qdrant:6333/collections/cascade_incident_memory >/dev/null
              code="$(curl -s -o /tmp/qdrant-knowledge-init-response -w '%{http_code}' -X PUT http://qdrant:6333/collections/cascade_knowledge_base \
                -H 'Content-Type: application/json' \
                --data '{"vectors":{"size":128,"distance":"Cosine"},"optimizers_config":{"indexing_threshold":1000}}')"
              if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then
                cat /tmp/qdrant-knowledge-init-response
                curl -sf -X PATCH http://qdrant:6333/collections/cascade_knowledge_base \
                  -H 'Content-Type: application/json' \
                  --data '{"optimizers_config":{"indexing_threshold":1000}}'
                curl -sf http://qdrant:6333/collections/cascade_knowledge_base >/dev/null
                exit 0
              fi
              cat /tmp/qdrant-knowledge-init-response
              exit 1
