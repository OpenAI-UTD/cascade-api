apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-service
  namespace: cascade-system
  labels:
    app: topology-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topology-service
  template:
    metadata:
      labels:
        app: topology-service
    spec:
      serviceAccountName: topology-service
      containers:
        - name: topology-service
          image: cascade-topology-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
