apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal-reconstruction-service
  namespace: cascade-system
  labels:
    app: causal-reconstruction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: causal-reconstruction-service
  template:
    metadata:
      labels:
        app: causal-reconstruction-service
    spec:
      containers:
        - name: causal-reconstruction-service
          image: cascade-causal-reconstruction-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: EXPERIMENT_TOPIC
              value: experiments.events
            - name: ENRICHED_TOPIC
              value: telemetry.enriched
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
