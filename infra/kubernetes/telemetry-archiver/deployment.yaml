apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-archiver
  namespace: cascade-system
  labels:
    app: telemetry-archiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-archiver
  template:
    metadata:
      labels:
        app: telemetry-archiver
    spec:
      containers:
        - name: telemetry-archiver
          image: cascade-telemetry-archiver:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: TELEMETRY_ENRICHED_TOPIC
              value: telemetry.enriched
            - name: EXPERIMENTS_EVENTS_TOPIC
              value: experiments.events
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
