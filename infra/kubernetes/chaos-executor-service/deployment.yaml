apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-executor-service
  namespace: cascade-system
  labels:
    app: chaos-executor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-executor-service
  template:
    metadata:
      labels:
        app: chaos-executor-service
    spec:
      serviceAccountName: chaos-executor-service
      containers:
        - name: chaos-executor-service
          image: cascade-chaos-executor-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8020
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: CHAOS_PLANNER_SERVICE_URL
              value: http://chaos-planner-service.cascade-system.svc.cluster.local:8019
            - name: RETRIEVAL_SERVICE_URL
              value: http://retrieval-service.cascade-system.svc.cluster.local:8012
            - name: AGENT_ORCHESTRATOR_SERVICE_URL
              value: http://agent-orchestrator-service.cascade-system.svc.cluster.local:8018
            - name: EXPERIMENT_TRACKER_SERVICE_URL
              value: http://experiment-tracker-service.cascade-system.svc.cluster.local:8002
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: CHAOS_EVENTS_TOPIC
              value: chaos.experiments
            - name: ENABLE_DANGEROUS_ACTIONS
              value: "false"
            - name: ENABLE_REAL_CHAOS
              value: "false"
            - name: CASCADE_LIVE_DEMO_MODE
              value: "false"
            - name: CASCADE_ALLOWED_CLUSTER_CONTEXT
              value: kind-cascade
            - name: CASCADE_ALLOWED_TARGET_NAMESPACE
              value: cascade-targets
            - name: CASCADE_REQUIRE_APPROVAL
              value: "true"
            - name: CASCADE_REQUIRE_DRY_RUN_FIRST
              value: "true"
            - name: CASCADE_AUTH_ENABLED
              value: "false"
            - name: CASCADE_LOCAL_DEMO_AUTH_BYPASS
              value: "false"
            - name: CASCADE_API_KEYS
              value: ""
            - name: CASCADE_API_KEY_HASHES
              value: ""
            - name: CASCADE_AUTH_HEADER
              value: Authorization
            - name: CASCADE_APPROVAL_SIGNING_SECRET
              value: ""
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 640Mi
