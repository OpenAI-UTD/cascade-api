apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-tool-gateway
  namespace: cascade-system
  labels:
    app: agent-tool-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-tool-gateway
  template:
    metadata:
      labels:
        app: agent-tool-gateway
    spec:
      containers:
        - name: agent-tool-gateway
          image: cascade-agent-tool-gateway:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8017
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: RETRIEVAL_SERVICE_URL
              value: http://retrieval-service.cascade-system.svc.cluster.local:8012
            - name: KNOWLEDGE_RETRIEVAL_SERVICE_URL
              value: http://knowledge-retrieval-service.cascade-system.svc.cluster.local:8016
            - name: TOPOLOGY_SERVICE_URL
              value: http://topology-service.cascade-system.svc.cluster.local:8004
            - name: CAUSAL_RECONSTRUCTION_SERVICE_URL
              value: http://causal-reconstruction-service.cascade-system.svc.cluster.local:8005
            - name: INCIDENT_TIMELINE_SERVICE_URL
              value: http://incident-timeline-service.cascade-system.svc.cluster.local:8006
            - name: ANOMALY_DETECTOR_SERVICE_URL
              value: http://anomaly-detector-service.cascade-system.svc.cluster.local:8014
            - name: CHAOS_EXECUTOR_SERVICE_URL
              value: http://chaos-executor-service.cascade-system.svc.cluster.local:8020
            - name: REMEDIATION_RECOMMENDER_SERVICE_URL
              value: http://remediation-recommender-service.cascade-system.svc.cluster.local:8021
            - name: REMEDIATION_EXECUTOR_SERVICE_URL
              value: http://remediation-executor-service.cascade-system.svc.cluster.local:8023
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
