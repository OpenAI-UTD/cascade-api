apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-executor-service
  namespace: cascade-system
  labels:
    app: remediation-executor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-executor-service
  template:
    metadata:
      labels:
        app: remediation-executor-service
    spec:
      serviceAccountName: remediation-executor-service
      containers:
        - name: remediation-executor-service
          image: cascade-remediation-executor-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8023
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: REMEDIATION_EVENTS_TOPIC
              value: remediation.actions
            - name: EXECUTION_ENABLED
              value: "false"
            - name: ENABLE_DANGEROUS_ACTIONS
              value: "false"
            - name: ENABLE_REAL_REMEDIATION
              value: "false"
            - name: CASCADE_LIVE_DEMO_MODE
              value: "false"
            - name: CASCADE_ALLOWED_CLUSTER_CONTEXT
              value: kind-cascade
            - name: CASCADE_ALLOWED_TARGET_NAMESPACE
              value: cascade-targets
            - name: CASCADE_REQUIRE_APPROVAL
              value: "true"
            - name: CASCADE_REQUIRE_DRY_RUN_FIRST
              value: "true"
            - name: CASCADE_AUTH_ENABLED
              value: "false"
            - name: CASCADE_LOCAL_DEMO_AUTH_BYPASS
              value: "false"
            - name: CASCADE_API_KEYS
              value: ""
            - name: CASCADE_API_KEY_HASHES
              value: ""
            - name: CASCADE_AUTH_HEADER
              value: Authorization
            - name: CASCADE_APPROVAL_SIGNING_SECRET
              value: ""
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 640Mi

