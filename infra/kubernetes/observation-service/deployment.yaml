apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-service
  namespace: cascade-system
  labels:
    app: observation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observation-service
  template:
    metadata:
      labels:
        app: observation-service
    spec:
      serviceAccountName: observation-service
      containers:
        - name: observation-service
          image: cascade-observation-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: PROMETHEUS_URL
              value: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
            - name: TARGET_NAMESPACE
              value: cascade-targets
            - name: TELEMETRY_PUBLISH_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: KAFKA_RAW_TOPIC
              value: telemetry.raw
            - name: TELEMETRY_PUBLISH_INTERVAL_SECONDS
              value: "10"
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
