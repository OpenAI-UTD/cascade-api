apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-recommender-service
  namespace: cascade-system
  labels:
    app: remediation-recommender-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-recommender-service
  template:
    metadata:
      labels:
        app: remediation-recommender-service
    spec:
      containers:
        - name: remediation-recommender-service
          image: cascade-remediation-recommender-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8021
          env:
            - name: CASCADE_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_HOST
              value: clickhouse.cascade-system.svc.cluster.local
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: cascade
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda.cascade-system.svc.cluster.local:9092
            - name: REMEDIATION_EVENTS_TOPIC
              value: remediation.actions
            - name: RETRIEVAL_SERVICE_URL
              value: http://retrieval-service.cascade-system.svc.cluster.local:8012
            - name: AGENT_ORCHESTRATOR_SERVICE_URL
              value: http://agent-orchestrator-service.cascade-system.svc.cluster.local:8018
            - name: KNOWLEDGE_RETRIEVAL_SERVICE_URL
              value: http://knowledge-retrieval-service.cascade-system.svc.cluster.local:8016
            - name: WEB_CONCURRENCY
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi

