[pytest]
# Scope collection to the real test suite. The `examples/` tree contains
# intentionally-broken fixtures (e.g. repo-qa-fixture with a failing
# test_retry_timeout) that the QA runner is supposed to detect and propose
# fixes for — they must NOT be collected by the main pytest run.
testpaths = tests
norecursedirs = examples .git node_modules web dist build
# Tests import `services.*` and `tests.*` as packages from the repo root.
pythonpath = .
addopts = -ra
